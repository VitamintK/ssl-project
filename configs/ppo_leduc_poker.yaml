algorithm_name: ppo
anneal_lr: true
# clip_coef: 0.025
clip_coef: 0.035
clip_vloss: true
ent_coef: 0.012
gae: true
gae_lambda: 0.95
gamma: 0.99
#### with norm_adv, max_grad_norm should be something like 6
max_grad_norm: 6
norm_adv: true
learning_rate: 5.5e-5
final_learning_rate: 5.5e-5
#### without norm_adv, max_grad_norm should be something like 20
# norm_adv: false
# max_grad_norm: 20
#########################################################
num_envs: 1
num_minibatches: 1
num_steps: 256
target_kl: null
update_epochs: 8
vf_coef: 0.0625

eval_every: 3